{% extends 'recipes/base.html' %}

{% block title %}Добавить рецепт{% endblock %}

{% block content %}
<h2>➕ Добавить рецепт</h2>
<form method="POST">
    {% csrf_token %}
    <div style="margin-bottom: 20px;">
        <label style="font-weight: 600;">🍽️ Название:</label>
        {{ form.title }}
    </div>
    <div style="margin-bottom: 20px;">
        <label style="font-weight: 600;">📝 Ингредиенты:</label>
        {{ form.ingredients }}
    </div>
    <div style="margin-bottom: 20px;">
        <label style="font-weight: 600;">👨‍🍳 Приготовление:</label>
        {{ form.instructions }}
    </div>
    <button type="submit">💾 Сохранить рецепт</button>
    <a href="{% url 'recipes:index' %}" style="margin-left: 10px;">❌ Отмена</a>
</form>
{% endblock %}
