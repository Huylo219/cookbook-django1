services:
  - type: web
    name: my-cookbook
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn cookbook.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: RENDER
        value: true
      - key: DATABASE_URL
        value: "postgresql://Internal Database URL"
